name: Master Strand Extinction

on:
  push:
    branches: [main]
    paths:
      - jobs/master-strand-extinction/*.json
  schedule:
    - cron: '2-57/10 * * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: Immutable extinction job ID
        required: true
        type: string
      approval_id:
        description: Private approval record ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: master-strand-extinction-${{ inputs.job_id || github.sha }}
  cancel-in-progress: false

jobs:
  extinguish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APEX_CONTROL_REPO: GlacierEQ/llm-runner-teams

    steps:
      - name: Checkout public bootstrap face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve strict extinction envelope
        id: plan
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            JOB_ID="${{ inputs.job_id }}"
            APPROVAL_ID="${{ inputs.approval_id }}"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            JOB_FILE="$(find jobs/master-strand-extinction -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
            test -n "$JOB_FILE" || { echo "no scheduled extinction job exists" >&2; exit 1; }
            readarray -t VALUES < <(python3 - "$JOB_FILE" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if set(data) != {'job_id', 'approval_id', 'owner', 'mode'}:
              raise SystemExit('extinction envelope fields are invalid')
          for field in ('job_id', 'approval_id'):
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{7,63}', data.get(field, '')):
                  raise SystemExit(f'{field} is invalid')
          if data.get('owner') != 'GlacierEQ' or data.get('mode') != 'apply':
              raise SystemExit('extinction envelope scope is invalid')
          print(data['job_id'])
          print(data['approval_id'])
          PY
            )
            JOB_ID="${VALUES[0]}"
            APPROVAL_ID="${VALUES[1]}"
          else
            mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^jobs/master-strand-extinction/[A-Za-z0-9._-]+\.json$' || true)
            test "${#FILES[@]}" -eq 1 || { echo "exactly one extinction job file is required" >&2; exit 1; }
            readarray -t VALUES < <(python3 - "${FILES[0]}" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if set(data) != {'job_id', 'approval_id', 'owner', 'mode'}:
              raise SystemExit('extinction envelope fields are invalid')
          for field in ('job_id', 'approval_id'):
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{7,63}', data.get(field, '')):
                  raise SystemExit(f'{field} is invalid')
          if data.get('owner') != 'GlacierEQ' or data.get('mode') != 'apply':
              raise SystemExit('extinction envelope scope is invalid')
          print(data['job_id'])
          print(data['approval_id'])
          PY
            )
            JOB_ID="${VALUES[0]}"
            APPROVAL_ID="${VALUES[1]}"
          fi
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "approval_id=$APPROVAL_ID" >> "$GITHUB_OUTPUT"

      - name: Check immutable result path
        id: existing
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
        run: |
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          url = f"https://api.github.com/repos/GlacierEQ/llm-runner-teams/contents/results/{os.environ['JOB_ID']}.json?ref=main"
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['APEX_CONTROL_TOKEN']}",
              'User-Agent': 'apex-master-strand-extinction',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              urllib.request.urlopen(request, timeout=30)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  value = 'false'
              else:
                  raise
          else:
              value = 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'exists={value}\n')
          PY

      - name: Require dedicated extinction credentials
        if: steps.existing.outputs.exists != 'true'
        id: credentials
        continue-on-error: true
        env:
          APEX_PRIVATE_READ_TOKEN: ${{ secrets.APEX_PRIVATE_READ_TOKEN }}
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
          APEX_BRANCH_WRITE_TOKEN: ${{ secrets.APEX_BRANCH_WRITE_TOKEN }}
        run: |
          test -n "$APEX_PRIVATE_READ_TOKEN" || { echo "APEX_PRIVATE_READ_TOKEN is required" >&2; exit 1; }
          test -n "$APEX_CONTROL_TOKEN" || { echo "APEX_CONTROL_TOKEN is required" >&2; exit 1; }
          test -n "$APEX_BRANCH_WRITE_TOKEN" || { echo "APEX_BRANCH_WRITE_TOKEN is required" >&2; exit 1; }

      - name: Checkout trusted runner source
        if: steps.existing.outputs.exists != 'true' && steps.credentials.outcome == 'success'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GlacierEQ/public-actions-runner-host
          ref: main
          token: ${{ secrets.APEX_PRIVATE_READ_TOKEN }}
          path: runner
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact credential blocker
        if: steps.existing.outputs.exists != 'true' && steps.credentials.outcome == 'failure'
        env:
          JOB_ID: ${{ steps.plan.outputs.job_id }}
          APPROVAL_ID: ${{ steps.plan.outputs.approval_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          result = {
              'schema_version': '1.0',
              'job_id': os.environ['JOB_ID'],
              'action': 'master-strand-extinction',
              'mode': 'apply',
              'owner': 'GlacierEQ',
              'approval_id': os.environ['APPROVAL_ID'],
              'status': 'blocked',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'exact_blocker': 'dedicated least-privilege extinction credentials are not available in the public execution face',
              'truth_boundary': 'No branch deletion was attempted.',
          }
          open('master-strand-result.json', 'w', encoding='utf-8').write(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY

      - name: Delete only branches proven to contain no unique progress
        if: steps.existing.outputs.exists != 'true' && steps.credentials.outcome == 'success'
        id: extinction
        continue-on-error: true
        env:
          APEX_PRIVATE_READ_TOKEN: ${{ secrets.APEX_PRIVATE_READ_TOKEN }}
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
          APEX_BRANCH_WRITE_TOKEN: ${{ secrets.APEX_BRANCH_WRITE_TOKEN }}
        run: |
          python3 runner/scripts/master_strand_extinction.py \
            --owner GlacierEQ \
            --mode apply \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --approval-id "${{ steps.plan.outputs.approval_id }}" \
            --output master-strand-result.json

      - name: Publish immutable private extinction receipt
        if: steps.existing.outputs.exists != 'true' && always() && hashFiles('master-strand-result.json') != ''
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          result = json.load(open('master-strand-result.json', encoding='utf-8'))
          if result.get('job_id') != os.environ['JOB_ID']:
              raise SystemExit('result job_id mismatch')
          canonical = json.dumps(result, sort_keys=True, separators=(',', ':')).encode()
          result['receipt'] = {
              'published_at': datetime.now(timezone.utc).isoformat(),
              'payload_sha256': hashlib.sha256(canonical).hexdigest(),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'execution_repo': os.environ.get('GITHUB_REPOSITORY', ''),
              'public_runner_sha': os.environ.get('GITHUB_SHA', ''),
          }
          body = (json.dumps(result, indent=2, sort_keys=True) + '\n').encode()
          remote = f"https://api.github.com/repos/GlacierEQ/llm-runner-teams/contents/results/{os.environ['JOB_ID']}.json"
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['APEX_CONTROL_TOKEN']}",
              'Content-Type': 'application/json',
              'User-Agent': 'apex-master-strand-extinction',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          check = urllib.request.Request(remote + '?ref=main', headers=headers)
          try:
              urllib.request.urlopen(check, timeout=30)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              raise SystemExit('immutable result path already exists')
          payload = json.dumps({
              'message': f"runner: record immutable Master Strand extinction {os.environ['JOB_ID']}",
              'content': base64.b64encode(body).decode('ascii'),
          }).encode()
          request = urllib.request.Request(remote, data=payload, headers=headers, method='PUT')
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'publish failed with status {response.status}')
          PY

      - name: Publish sanitized summary
        if: always() && hashFiles('master-strand-result.json') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open('master-strand-result.json', encoding='utf-8'))
          summary = data.get('summary', {})
          print('## Master Strand Extinction')
          print(f"- Status: `{data.get('status')}`")
          print(f"- Resolved branches deleted: `{summary.get('deleted', 0)}`")
          print(f"- Unique-progress branches retained for integration: `{summary.get('unique_progress_branches', 0)}`")
          print(f"- Detailed receipt: private control plane / results / {data.get('job_id')}.json")
          PY

      - name: Enforce truthful result
        if: always() && steps.existing.outputs.exists != 'true'
        run: |
          test -f master-strand-result.json
          python3 - <<'PY'
          import json
          data = json.load(open('master-strand-result.json', encoding='utf-8'))
          if data.get('status') != 'completed':
              raise SystemExit(data.get('exact_blocker') or 'Master Strand extinction did not complete cleanly')
          PY
