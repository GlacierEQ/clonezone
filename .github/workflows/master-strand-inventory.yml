name: Master Strand Inventory

on:
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - jobs/master-strand-inventory/*.json
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: Immutable inventory job ID
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: master-strand-inventory-${{ inputs.job_id || github.event.issue.number || github.sha }}
  cancel-in-progress: false

jobs:
  inventory:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       github.event.issue.author_association == 'OWNER' &&
       startsWith(github.event.issue.title, '[MASTER STRAND INVENTORY] '))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APEX_CONTROL_REPO: GlacierEQ/llm-runner-teams

    steps:
      - name: Checkout public bootstrap face
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve strict inventory envelope
        id: plan
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            JOB_ID="${{ inputs.job_id }}"
          elif [ "$GITHUB_EVENT_NAME" = "issues" ]; then
            JOB_ID="$(python3 - "$GITHUB_EVENT_PATH" <<'PY'
          import json, re, sys
          event = json.load(open(sys.argv[1], encoding='utf-8'))
          issue = event.get('issue') or {}
          data = json.loads(issue.get('body') or '{}')
          allowed = {'job_id', 'owner', 'mode'}
          if set(data) != allowed:
              raise SystemExit('inventory envelope fields are invalid')
          job_id = data.get('job_id', '')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{7,63}', job_id):
              raise SystemExit('job_id is invalid')
          if data.get('owner') != 'GlacierEQ' or data.get('mode') != 'inventory':
              raise SystemExit('inventory envelope scope is invalid')
          print(job_id)
          PY
            )"
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            JOB_FILE="$(find jobs/master-strand-inventory -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)"
            test -n "$JOB_FILE" || { echo "no scheduled inventory job exists" >&2; exit 1; }
            JOB_ID="$(python3 - "$JOB_FILE" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if set(data) != {'job_id', 'owner', 'mode'}:
              raise SystemExit('inventory envelope fields are invalid')
          job_id = data.get('job_id', '')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{7,63}', job_id):
              raise SystemExit('job_id is invalid')
          if data.get('owner') != 'GlacierEQ' or data.get('mode') != 'inventory':
              raise SystemExit('inventory envelope scope is invalid')
          print(job_id)
          PY
            )"
          else
            mapfile -t FILES < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^jobs/master-strand-inventory/[A-Za-z0-9._-]+\.json$' || true)
            test "${#FILES[@]}" -eq 1 || { echo "exactly one inventory job file is required" >&2; exit 1; }
            JOB_ID="$(python3 - "${FILES[0]}" <<'PY'
          import json, re, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          if set(data) != {'job_id', 'owner', 'mode'}:
              raise SystemExit('inventory envelope fields are invalid')
          job_id = data.get('job_id', '')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{7,63}', job_id):
              raise SystemExit('job_id is invalid')
          if data.get('owner') != 'GlacierEQ' or data.get('mode') != 'inventory':
              raise SystemExit('inventory envelope scope is invalid')
          print(job_id)
          PY
            )"
          fi
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

      - name: Skip already-published scheduled inventory
        if: github.event_name == 'schedule'
        id: existing
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
        run: |
          python3 - <<'PY'
          import os, urllib.error, urllib.request
          url = f"https://api.github.com/repos/GlacierEQ/llm-runner-teams/contents/results/{os.environ['JOB_ID']}.json?ref=main"
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['APEX_CONTROL_TOKEN']}",
              'User-Agent': 'apex-master-strand-inventory',
              'X-GitHub-Api-Version': '2022-11-28',
          })
          try:
              urllib.request.urlopen(request, timeout=30)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
                      handle.write('exists=false\n')
              else:
                  raise
          else:
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
                  handle.write('exists=true\n')
          PY

      - name: Require private read and control credentials
        if: steps.existing.outputs.exists != 'true'
        env:
          APEX_PRIVATE_READ_TOKEN: ${{ secrets.APEX_PRIVATE_READ_TOKEN }}
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
        run: |
          test -n "$APEX_PRIVATE_READ_TOKEN" || { echo "APEX_PRIVATE_READ_TOKEN is required" >&2; exit 1; }
          test -n "$APEX_CONTROL_TOKEN" || { echo "APEX_CONTROL_TOKEN is required" >&2; exit 1; }

      - name: Checkout trusted runner source
        if: steps.existing.outputs.exists != 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: GlacierEQ/public-actions-runner-host
          ref: main
          token: ${{ secrets.APEX_PRIVATE_READ_TOKEN }}
          path: runner
          fetch-depth: 1
          persist-credentials: false

      - name: Run organization-wide branch inventory
        if: steps.existing.outputs.exists != 'true'
        env:
          APEX_PRIVATE_READ_TOKEN: ${{ secrets.APEX_PRIVATE_READ_TOKEN }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
        run: |
          python3 runner/scripts/master_strand_extinction.py \
            --owner GlacierEQ \
            --mode inventory \
            --job-id "${{ steps.plan.outputs.job_id }}" \
            --output master-strand-result.json

      - name: Publish immutable private inventory receipt
        if: steps.existing.outputs.exists != 'true'
        env:
          APEX_CONTROL_TOKEN: ${{ secrets.APEX_CONTROL_TOKEN }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          from datetime import datetime, timezone
          result = json.load(open('master-strand-result.json', encoding='utf-8'))
          if result.get('job_id') != os.environ['JOB_ID']:
              raise SystemExit('result job_id mismatch')
          canonical = json.dumps(result, sort_keys=True, separators=(',', ':')).encode()
          result['receipt'] = {
              'published_at': datetime.now(timezone.utc).isoformat(),
              'payload_sha256': hashlib.sha256(canonical).hexdigest(),
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'workflow_run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT', ''),
              'execution_repo': os.environ.get('GITHUB_REPOSITORY', ''),
              'public_runner_sha': os.environ.get('GITHUB_SHA', ''),
          }
          body = (json.dumps(result, indent=2, sort_keys=True) + '\n').encode()
          remote = f"https://api.github.com/repos/GlacierEQ/llm-runner-teams/contents/results/{os.environ['JOB_ID']}.json"
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['APEX_CONTROL_TOKEN']}",
              'Content-Type': 'application/json',
              'User-Agent': 'apex-master-strand-inventory',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          check = urllib.request.Request(remote + '?ref=main', headers=headers)
          try:
              urllib.request.urlopen(check, timeout=30)
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          else:
              raise SystemExit('immutable result path already exists')
          payload = json.dumps({
              'message': f"runner: record immutable Master Strand inventory {os.environ['JOB_ID']}",
              'content': base64.b64encode(body).decode('ascii'),
          }).encode()
          request = urllib.request.Request(remote, data=payload, headers=headers, method='PUT')
          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status not in (200, 201):
                  raise SystemExit(f'publish failed with status {response.status}')
          PY

      - name: Publish truthful public issue status
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_ID: ${{ steps.plan.outputs.job_id }}
        run: |
          if [ -f master-strand-result.json ]; then
            STATUS="$(python3 -c "import json; print(json.load(open('master-strand-result.json')).get('status','unknown'))")"
            gh issue comment "$ISSUE_NUMBER" --body "Master Strand inventory \`$JOB_ID\`: \`$STATUS\`. Detailed receipt is private."
          else
            gh issue comment "$ISSUE_NUMBER" --body "Master Strand inventory was blocked before a result receipt was created."
          fi
          gh issue close "$ISSUE_NUMBER"

      - name: Publish sanitized summary
        if: always() && hashFiles('master-strand-result.json') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open('master-strand-result.json', encoding='utf-8'))
          summary = data.get('summary', {})
          print('## Master Strand Inventory')
          print(f"- Status: `{data.get('status')}`")
          print(f"- Repositories scanned: `{summary.get('repositories_scanned', 0)}`")
          print(f"- Nondefault branches: `{summary.get('nondefault_branches', 0)}`")
          print(f"- Immediately delete-ready: `{summary.get('delete_ready', 0)}`")
          print(f"- Unique-progress branches: `{summary.get('unique_progress_branches', 0)}`")
          print(f"- Private receipt: `GlacierEQ/llm-runner-teams/results/{data.get('job_id')}.json`")
          PY
